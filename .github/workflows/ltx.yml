name: ltx
on:
  push:
    paths: ["ltx/jobs/**"]
  workflow_dispatch:
    inputs:
      job: {required: false, default: ""}
permissions:
  contents: write
concurrency: ltx
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      job: ${{ steps.p.outputs.job }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: ltx, filter: "blob:none", fetch-depth: 2}
      - id: p
        run: |
          J=$(git diff --name-only HEAD~1 HEAD -- ltx/jobs | grep '\.json$' | tail -1)
          [ -n "${{ github.event.inputs.job }}" ] && J=ltx/jobs/${{ github.event.inputs.job }}.json
          N=$(basename $J .json); echo "job $N"
          echo "job=$N" >> $GITHUB_OUTPUT
          echo "matrix=$(python3 -c "import json;print(json.dumps([i['name'] for i in json.load(open('$J'))['items']]))")" >> $GITHUB_OUTPUT
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        name: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: ltx, filter: "blob:none", fetch-depth: 1}
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h / | tail -1; nproc; sudo swapoff -a; sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2; free -g | head -3; lscpu | grep -i 'model name\|flags' | cut -c1-400
      - name: Deps
        run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision && pip install -q "diffusers>=0.33" transformers accelerate sentencepiece imageio imageio-ffmpeg protobuf ftfy huggingface_hub safetensors
      - name: Run
        run: |
          python3 -c "import json;J=json.load(open('ltx/jobs/${{ needs.plan.outputs.job }}.json'));it=[i for i in J['items'] if i['name']=='${{ matrix.name }}'][0];it={**J.get('defaults',{}),**it};json.dump(it,open('item.json','w'))"
          mkdir -p res; export PYTHONUNBUFFERED=1
          timeout $(python3 -c "import json;print(json.load(open('item.json')).get('tmo',150))")m python3 ltx/$(python3 -c "import json;print(json.load(open('item.json')).get('script','run.py'))") item.json res 2>&1 | grep --line-buffered -v "it/s\]" | tee res/${{ matrix.name }}.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "${{ matrix.name }}", path: res/, if-no-files-found: ignore}
  collect:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: ltx, filter: "blob:none", fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {path: "ltx/out/${{ needs.plan.outputs.job }}", merge-multiple: true}
      - run: |
          git config user.name "ltx-bot"; git config user.email "ltx-bot@users.noreply.github.com"
          git add ltx/out; git diff --cached --quiet || (git commit -m "ltx ${{ needs.plan.outputs.job }}" && git pull --rebase && git push)
