name: ltx
on:
  push:
    paths: ["ltx/jobs/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: ltx
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      job: ${{ steps.p.outputs.job }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: ltx, filter: "blob:none", fetch-depth: 1}
      - id: p
        run: |
          J=$(ls -t ltx/jobs/*.json | head -1); N=$(basename $J .json)
          echo "job=$N" >> $GITHUB_OUTPUT
          echo "matrix=$(python3 -c "import json;print(json.dumps([i['name'] for i in json.load(open('$J'))['items']]))")" >> $GITHUB_OUTPUT
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        name: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: ltx, filter: "blob:none", fetch-depth: 1}
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h / | tail -1; nproc; free -g | head -2
      - name: Deps
        run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision && pip install -q "diffusers>=0.33" transformers accelerate sentencepiece imageio imageio-ffmpeg protobuf
      - name: Run
        run: |
          python3 -c "import json;J=json.load(open('ltx/jobs/${{ needs.plan.outputs.job }}.json'));it=[i for i in J['items'] if i['name']=='${{ matrix.name }}'][0];it={**J.get('defaults',{}),**it};json.dump(it,open('item.json','w'))"
          python3 ltx/run.py item.json res 2>&1 | grep -v "it/s\]" | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "${{ matrix.name }}", path: res/, if-no-files-found: ignore}
  collect:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: ltx, filter: "blob:none", fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {path: "ltx/out/${{ needs.plan.outputs.job }}", merge-multiple: true}
      - run: |
          git config user.name "ltx-bot"; git config user.email "ltx-bot@users.noreply.github.com"
          git add ltx/out; git diff --cached --quiet || (git commit -m "ltx ${{ needs.plan.outputs.job }}" && git pull --rebase && git push)
